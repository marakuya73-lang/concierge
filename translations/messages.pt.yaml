    rajaaram_rec_abstinence_title: "Abstinência de álcool, drogas e sexo"
    rajaaram_rec_abstinence_text: "Evite o consumo de álcool, outras substâncias psicoativas e sexo por pelo menos 24 horas antes da terapia."
    rajaaram_rec_diet_title: "Dieta"
    rajaaram_rec_diet_text: "Recomendamos que você siga uma dieta leve e saudável pelo menos 24 horas antes da terapia, evitando alimentos pesados, processados e picantes, bem como carne vermelha, laticínios e alimentos com alto teor de gordura. Além disso, é recomendável evitar cafeína e açúcar antes da sessão."
    rajaaram_rec_mental_title: "Preparação mental"
    rajaaram_rec_mental_text: "É importante que você esteja com a mente tranquila e livre de preocupações pelo menos 24 horas antes da terapia. Alguns minutos de meditação ou relaxamento podem ajudar a alcançar um estado de calma e tranquilidade."
    rajaaram_rec_health_title: "Informações sobre saúde"
    rajaaram_rec_health_text: "Pedimos que você informe o terapeuta sobre quaisquer problemas de saúde, condições médicas ou medicamentos que esteja tomando, para garantir a segurança durante a terapia."
    rajaaram_rec_skincare: "Caso tenha costume em usar maquilhagem, hidratante ou creme solar (principalmente no rosto), pedimos que venha sem para sua terapia."
    rajaaram_rec_closing: "Seguindo essas recomendações pelo menos 24 horas antes da terapia, você estará contribuindo para uma experiência segura e eficaz. Se tiver alguma dúvida ou preocupação, não hesite em entrar em contato conosco para discutir suas necessidades individuais. Obrigado!"
