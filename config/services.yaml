parameters:
    env(VAPID_PUBLIC_KEY): ''
    env(VAPID_PRIVATE_KEY): ''
    env(VAPID_SUBJECT): ''
    env(GOOGLE_SERVICE_ACCOUNT_JSON_PATH): ''
    env(GOOGLE_CALENDAR_DOMO_ID): ''
    env(GOOGLE_CALENDAR_RAJAARAM_ID): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Security\AdminAuthenticator:
        arguments:
            $adminPassword: '%env(ADMIN_PASSWORD)%'

    App\Security\AdminUserProvider:
        arguments:
            $adminPassword: '%env(ADMIN_PASSWORD)%'

    App\Service\PropertyPhotoUploader:
        arguments:
            $uploadDirectory: '%kernel.project_dir%/public/uploads/property'

    App\Service\WebPushService:
        arguments:
            $vapidPublicKey: '%env(VAPID_PUBLIC_KEY)%'
            $vapidPrivateKey: '%env(VAPID_PRIVATE_KEY)%'
            $vapidSubject: '%env(VAPID_SUBJECT)%'

    App\Service\GoogleCalendarApiClient:
        arguments:
            $serviceAccountJsonPath: '%env(GOOGLE_SERVICE_ACCOUNT_JSON_PATH)%'

    App\Service\GoogleCalendarSyncService:
        arguments:
            $defaultDomoCalendarId: '%env(GOOGLE_CALENDAR_DOMO_ID)%'
            $defaultRajaaramCalendarId: '%env(GOOGLE_CALENDAR_RAJAARAM_ID)%'
